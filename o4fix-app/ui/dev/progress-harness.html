<!doctype html>
<!--
  Dev harness for the per-clip trace playhead (o4fix-app/ui/trace.js). Open directly in a
  browser. Each card is built with the same markup and state classes app.js uses for a queue
  row, so it looks exactly like the app; the buttons below each card fake the backend events
  (job_trace before/after, job_progress, job_done).
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace playhead harness</title>
<link rel="stylesheet" href="../style.css">
<style>
  /* the app body is a fixed full-window grid; the harness needs a plain scrolling page */
  body.harness { display: block; overflow: auto; height: auto; }
  .harness main { max-width: 760px; margin: 0 auto; padding: 28px 16px 60px; }
  .harness h1 { font: 600 20px var(--display); margin: 0 0 4px; }
  .harness .lede { color: var(--ink-3); margin: 0 0 18px; }
  .harness .case { margin-bottom: 22px; }
  .harness .case h2 { font: 600 14px var(--display); color: var(--ink-2); margin: 0 0 6px; }
  .harness .ctl { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .harness .ctl .speed { color: var(--ink-3); font-size: 13px; margin-left: auto; }
  .harness .opt { display: flex; gap: 8px; align-items: center; color: var(--ink-2);
                  font-size: 13px; margin-bottom: 20px; }
</style>
</head>
<body class="harness">
<main>
  <h1>Trace playhead harness</h1>
  <p class="lede">Each card is a real queue row. Start fakes a repair with uneven progress events.</p>
  <label class="opt"><input type="checkbox" id="reduced"> Simulate reduced motion (set before Start)</label>
  <div id="cases"></div>
</main>

<script>
  // lets the checkbox stand in for prefers-reduced-motion; trace.js reads matchMedia at use time
  const realMM = window.matchMedia.bind(window);
  window.matchMedia = (q) => q.includes("prefers-reduced-motion")
    ? { matches: document.getElementById("reduced").checked, addEventListener() {}, removeEventListener() {} }
    : realMM(q);
</script>
<script src="../trace.js"></script>
<script>
  // synthetic 215 s clip shaped like 0083: noise level (deg/s) with a handful of bursts
  const T0 = 0, T1 = 215, N = 600;
  const BURSTS = [[48.8, 51.7], [53.2, 53.8], [113.1, 114.7], [143.6, 145.8], [180.7, 181.2], [211.7, 214.2]];
  const tAt = (i) => T0 + ((i + 0.5) / N) * (T1 - T0);
  const inB = (t) => BURSTS.some(([a, b]) => t >= a && t < b);
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const before = [], after = [], healthy = [];
  for (let i = 0; i < N; i++) {
    const t = tAt(i), calm = 1.6 + 0.8 * Math.abs(Math.sin(t * 0.37)) + 0.6 * rnd();
    before.push(inB(t) ? 20 + 260 * rnd() * rnd() : calm);
    after.push(inB(t) ? 2 + 1.5 * rnd() : calm);
    healthy.push(calm);
  }

  const STATUS = { waiting: "Waiting", working: "Patching bursts", done: "Repaired",
                   healthy: "No repair needed", error: "Failed", cancelled: "Cancelled" };

  function makeRow(name) {
    const li = document.createElement("li");
    li.innerHTML = `
      <div class="clip-head">
        <span class="fname"></span>
        <span class="status"><span class="dot"></span><span class="stxt"></span><span class="pct"></span></span>
      </div>
      <div class="trace"><div class="progress"></div></div>
      <div class="clip-foot"><span class="facts"></span><span class="msg"></span></div>`;
    li.querySelector(".fname").textContent = name;
    return li;
  }

  const CASES = [
    { title: "Repair with bursts", end: "after", endLabel: "Finish repair", bursts: BURSTS, values: before },
    { title: "Healthy clip, no bursts", end: "healthy", endLabel: "Finish (healthy)", bursts: [], values: healthy },
    { title: "Cancelled mid-run", end: "cancelled", endLabel: "Cancel", bursts: BURSTS, values: before },
    { title: "Error mid-run", end: "error", endLabel: "Fail", bursts: BURSTS, values: before },
  ];

  const host = document.getElementById("cases");
  CASES.forEach((c, k) => {
    const sec = document.createElement("section"); sec.className = "case";
    sec.innerHTML = `<h2>${c.title}</h2><ol class="queue"></ol>
      <div class="ctl"><button class="ghost small" data-a="start">Start</button>
      <button class="ghost small" data-a="end">${c.endLabel}</button>
      <span class="speed">auto-finish at 100%: <input type="checkbox" data-a="auto" ${k === 0 ? "checked" : ""}></span></div>`;
    host.appendChild(sec);
    const li = makeRow(`DJI_20260919133302_008${k}_D.MP4`);
    sec.querySelector(".queue").appendChild(li);
    const q = (s) => li.querySelector(s);
    const trace = new window.o4trace.ClipTrace(q(".trace"));
    let timer = 0, pct = 0, running = false;
    const setState = (s) => { li.className = "clip " + s; q(".stxt").textContent = STATUS[s]; };
    const setPct = (p) => { q(".pct").textContent = Math.round(p * 100) + "%"; q(".progress").style.width = (p * 100) + "%"; };
    setState("waiting"); setPct(0);

    function finish(kind) {
      if (!running) return;
      running = false; clearTimeout(timer);
      if (kind === "after") trace.setAfter({ values: after });
      trace.stop(kind === "after" ? "done" : kind);
      setState(kind === "after" ? "done" : kind);
      q(".pct").textContent = "";
    }
    function tick() {
      // uneven jumps and occasional stalls, like real job_progress events
      if (rnd() > 0.15) pct = Math.min(1, pct + rnd() * 0.035);
      trace.setProgress(pct); setPct(pct);
      if (pct >= 1 && sec.querySelector('[data-a="auto"]').checked) { finish(c.end === "after" ? "after" : c.end); return; }
      timer = setTimeout(tick, 100 + rnd() * 400);
    }
    sec.querySelector('[data-a="start"]').onclick = () => {
      clearTimeout(timer); pct = 0; running = true;
      setState("working"); setPct(0);
      q(".facts").innerHTML = c.bursts.length
        ? `<span><b>215.2</b> s</span><span><b>${c.bursts.length}</b> noise bursts</span>`
        : `<span><b>215.2</b> s</span>`;
      q(".msg").textContent = "";
      trace.setBefore({ t0: T0, t1: T1, values: c.values, bursts: c.bursts });
      tick();
    };
    sec.querySelector('[data-a="end"]').onclick = () => finish(c.end);
  });
</script>
</body>
</html>
